<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LandLink Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      body { background-color: #fff8f0; color: #1e1b16; font-family: 'Plus Jakarta Sans', sans-serif; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; vertical-align: middle; }
    </style>
  </head>
  <body>
    <header class="bg-[#412817] text-white shadow-md sticky top-0 z-40">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <a href="index.html" class="flex items-center gap-2 font-bold text-xl">
          <span class="material-symbols-outlined text-[#fdba4b]">location_on</span>LandLink
        </a>
        <div class="flex items-center gap-4">
          <span id="user-name" class="text-sm">User</span>
          <a href="index.html" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full">Home</a>
        </div>
      </div>
    </header>

    <main id="dashboard-page" class="mx-auto max-w-5xl px-6 py-16">
      <div class="rounded-[32px] bg-white p-10 shadow-lg border border-amber-900/10">
        <h1 id="dashboard-greeting" class="text-4xl font-semibold text-[#3e2723]">User Dashboard</h1>
        <p id="dashboard-details" class="mt-4 text-sm text-[#5a5145]">Manage your saved properties and quick actions.</p>
        <div class="mt-10 grid gap-6 md:grid-cols-2">
          <div class="rounded-3xl bg-amber-50 p-6 border border-amber-900/10">
            <p class="font-semibold text-[#3e2723]">Quick Actions</p>
            <div class="mt-4 space-y-3">
              <a href="browse.html" class="block w-full text-center rounded-full bg-[#412817] text-white py-2.5 text-xs font-semibold hover:bg-[#5a3e2b]">Browse All Lands</a>
              <a href="sell.html" class="block w-full text-center rounded-full bg-[#fdba4b] text-[#281800] py-2.5 text-xs font-semibold hover:bg-[#e0a23c]">Post New Land</a>
            </div>
          </div>
          <div class="rounded-3xl bg-amber-50 p-6 border border-amber-900/10">
            <p class="font-semibold text-[#3e2723]">Saved Favorites & Comparison</p>
            <p class="mt-2 text-xs text-[#5a5145]">Compare plots side-by-side or view saved favorites anytime.</p>
            <div class="mt-4 flex gap-3">
              <a href="compare.html" class="inline-block text-xs font-semibold text-[#412817] underline">View Compare List</a>
              <a href="browse.html" class="inline-block text-xs font-semibold text-[#412817] underline">Browse Favorites</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-[#412817] text-white py-10">
      <div class="mx-auto max-w-7xl px-6 text-sm opacity-90 text-center">&copy; 2024 LandLink User Dashboard</div>
    </footer>
    <script src="./site-common.js"></script>
    <script src="./whatsapp.js"></script>
  </body>
</html>
