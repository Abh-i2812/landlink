<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LandLink — List Your Property</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      body { background-color: #fff8f0; color: #1e1b16; font-family: 'Plus Jakarta Sans', sans-serif; }
      .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(130, 116, 109, 0.2); }
    </style>
  </head>
  <body>
    <header class="bg-[#412817] text-white shadow-md sticky top-0 z-40">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <a href="index.html" class="flex items-center gap-2 font-bold text-xl">
          <span class="material-symbols-outlined" style="color: #fdba4b;">location_on</span>LandLink
        </a>
        <nav class="hidden lg:flex items-center gap-6 text-sm opacity-90">
          <a href="index.html" class="hover:text-[#fdba4b]">Home</a>
          <a href="browse.html" class="hover:text-[#fdba4b]">Browse</a>
          <a href="sell.html" class="font-semibold text-[#fdba4b]">Sell</a>
          <a href="about.html" class="hover:text-[#fdba4b]">About</a>
          <a href="contact.html" class="hover:text-[#fdba4b]">Contact</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-6 py-16">
      <div data-aos="fade-up" class="text-center mb-10">
        <p class="mb-3 inline-flex rounded-full bg-[#fdba4b]/20 px-3 py-1 text-sm font-semibold text-[#412817]">List Your Property</p>
        <h1 class="text-4xl font-bold text-[#412817]">Post Your Land</h1>
        <p class="mt-4 text-[#50453e]">Submit your property details and your listing will be published immediately on the homepage.</p>
      </div>

      <!-- Property form -->
      <div id="property-form-section" class="glass-card rounded-3xl bg-white p-8 shadow-lg" data-aos="fade-up">
        <form id="property-form" class="space-y-4">
          <label class="block text-sm font-semibold text-[#412817]">
            Property Title <span class="text-red-600">*</span>
            <input id="property-title" name="property_title" type="text" required placeholder="e.g., Agricultural land near Pune" class="mt-2 w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]" />
          </label>

          <label class="block text-sm font-semibold text-[#412817]">
            Property Type <span class="text-red-600">*</span>
            <select id="property-type" name="property_type" required class="mt-2 w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]">
              <option value="">Select type</option>
              <option value="Agricultural">Agricultural</option>
              <option value="NA Residential">NA Residential</option>
              <option value="Commercial">Commercial</option>
              <option value="Industrial">Industrial</option>
              <option value="Farmhouse">Farmhouse</option>
            </select>
          </label>

          <label class="block text-sm font-semibold text-[#412817]">
            Location
            <input id="property-location" name="location" type="text" placeholder="e.g., Pune, Maharashtra" class="mt-2 w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]" />
          </label>

          <label class="block text-sm font-semibold text-[#412817]">
            Size
            <input id="property-size" name="size" type="text" placeholder='e.g., 2 acres' class="mt-2 w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]" />
          </label>

          <label class="block text-sm font-semibold text-[#412817]">
            Asking Price (₹)
            <input id="property-price" name="asking_price" type="number" min="0" step="1" placeholder="4500000" class="mt-2 w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]" />
          </label>

          <label class="block text-sm font-semibold text-[#412817]">
            Property Image URL (Optional)
            <input id="property-image" name="image_url" type="url" placeholder="e.g., https://images.unsplash.com/photo-1500382017468-9049fed747ef" class="mt-2 w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]" />
          </label>

          <label class="block text-sm font-semibold text-[#412817]">
            Description
            <textarea id="property-description" name="description" rows="4" placeholder="Describe the property, features, soil quality, etc." class="mt-2 w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]"></textarea>
          </label>

          <label class="block text-sm font-semibold text-[#412817]">
            Your Name
            <input id="property-seller-name" name="seller_name" type="text" placeholder="Your Name" class="mt-2 w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]" />
          </label>

          <label class="block text-sm font-semibold text-[#412817]">
            Your Phone Number
            <input id="property-phone" name="seller_phone" type="tel" placeholder="9876543210" class="mt-2 w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]" />
          </label>

          <button id="property-submit-btn" type="submit" class="w-full rounded-full bg-[#412817] px-4 py-3 font-semibold text-white hover:bg-[#5a3e2b] active:scale-95 transition-all shadow-md">
            Submit Listing
          </button>

          <div id="property-form-status" class="hidden" role="alert"></div>
        </form>
      </div>
    </main>

    <footer class="bg-[#412817] text-white py-12 mt-20">
      <div class="mx-auto max-w-7xl px-6 text-center text-sm opacity-75">
        &copy; 2024 LandLink. All rights reserved.
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
    <script src="./site-common.js"></script>
    <script src="./whatsapp.js"></script>
    <script type="module">
      import { supabase, showFormStatus, clearFormStatus } from "./supabase.js";

      const form = document.getElementById("property-form");
      const statusEl = document.getElementById("property-form-status");
      const submitBtn = document.getElementById("property-submit-btn");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearFormStatus(statusEl);

        const title = document.getElementById("property-title").value.trim();
        const propertyType = document.getElementById("property-type").value;
        if (!title || !propertyType) {
          showFormStatus(statusEl, "Property title and type are required.", true);
          return;
        }

        const askingPriceRaw = document.getElementById("property-price").value;
        const askingPrice = askingPriceRaw ? Number(askingPriceRaw) : null;
        const imageUrl = document.getElementById("property-image").value.trim() || null;

        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting…";

        const { error } = await supabase.from("properties").insert({
          property_title: title,
          property_type: propertyType,
          location: document.getElementById("property-location").value.trim() || null,
          size: document.getElementById("property-size").value.trim() || null,
          asking_price: askingPrice,
          image_url: imageUrl,
          description: document.getElementById("property-description").value.trim() || null,
          seller_name: document.getElementById("property-seller-name").value.trim() || "Land Seller",
          seller_email: "",
          seller_phone: document.getElementById("property-phone").value.trim() || null,
        });

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Listing";

        if (error) {
          showFormStatus(statusEl, "Failed to submit listing: " + error.message, true);
          return;
        }

        showFormStatus(statusEl, "Your property has been submitted successfully! It is now live on the homepage.");
        form.reset();
      });

      AOS.init({ duration: 800, once: true });
    </script>
  </body>
</html>
