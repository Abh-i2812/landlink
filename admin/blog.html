<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <script src="../api.js"></script>
  <script src="./admin-common.js"></script>
  <script>
    (async function () {
      if (!AdminCommon.requireAdmin()) return;
      AdminCommon.shell('blog.html', 'Blog', `
        <form id="form" class="rounded-3xl bg-white p-6 shadow space-y-3 mb-6">
          <input id="title" class="w-full rounded-xl border px-3 py-2" placeholder="Title" />
          <textarea id="content" class="w-full rounded-xl border px-3 py-2" rows="4" placeholder="Content"></textarea>
          <label class="text-sm"><input id="published" type="checkbox" /> Publish</label>
          <button class="rounded-full bg-[#412817] text-white px-4 py-2 text-sm">Create post</button>
        </form>
        <div id="list" class="space-y-3"></div>`);
      async function load() {
        const { posts } = await LandLinkAPI.admin.blog();
        document.getElementById('list').innerHTML = (posts || []).map(p => `
          <div class="rounded-2xl bg-white p-4 shadow"><div class="font-semibold">${p.title}</div><div class="text-xs">${p.published ? 'Published' : 'Draft'} • ${p.slug}</div></div>
        `).join('') || '<p>No posts yet</p>';
      }
      document.getElementById('form').onsubmit = async (e) => {
        e.preventDefault();
        try {
          await LandLinkAPI.admin.createBlog({
            title: document.getElementById('title').value,
            content: document.getElementById('content').value,
            published: document.getElementById('published').checked,
          });
          e.target.reset();
          await load();
        } catch (err) { AdminCommon.toast(err.message); }
      };
      await load();
    })();
  </script>
  <script src="../site-common.js"></script>
</body>
</html>
