<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LandLink Login | Authentication</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      body { background-color: #fff8f0; color: #1e1b16; font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="bg-[#412817] text-white shadow-md sticky top-0 z-40">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <a href="index.html" class="flex items-center gap-2 font-bold text-xl">
          <span class="material-symbols-outlined text-[#fdba4b]">location_on</span>LandLink
        </a>
        <button onclick="window.history.back()" class="hover:text-[#fdba4b]">
          ← Back
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-md px-6 py-16">
      <div class="bg-white rounded-3xl p-8 shadow-xl border border-amber-900/10">
        <h2 class="text-3xl font-bold text-[#412817]">Sign In with Google</h2>
        <p class="mt-2 text-sm text-[#50453e]">Sign in using your Google account to access saved listings and preferences.</p>

        <div class="mt-8 space-y-4">
          <button id="auth-google-signin" class="w-full flex items-center justify-center gap-2 rounded-full border border-gray-300 bg-white px-4 py-3 text-sm font-semibold text-[#412817] hover:bg-gray-50 active:scale-95 transition-all shadow-sm">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5" />
            Sign in with Google
          </button>
        </div>

        <p id="auth-status" class="mt-4 text-xs text-center text-gray-500"></p>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#412817] text-white py-12 mt-20">
      <div class="mx-auto max-w-7xl px-6 text-center text-sm opacity-75">
        &copy; 2024 LandLink. All rights reserved.
      </div>
    </footer>

    <script src="./site-common.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAKXAyeJvxeNWf_IajCJOmeGpqPyTzbE_c",
        authDomain: "landlink-92fff.firebaseapp.com",
        projectId: "landlink-92fff",
        storageBucket: "landlink-92fff.firebasestorage.app",
        messagingSenderId: "783116475376",
        appId: "1:783116475376:web:3a9a1e51e73352c75adb35"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      const googleBtn = document.getElementById('auth-google-signin');
      const statusText = document.getElementById('auth-status');

      if (googleBtn) {
        googleBtn.addEventListener('click', async () => {
          try {
            statusText.textContent = "Signing in...";
            await signInWithPopup(auth, provider);
            statusText.textContent = "Sign in successful! Redirecting...";
            setTimeout(() => window.location.href = "index.html", 600);
          } catch (error) {
            statusText.textContent = "Sign-in error: " + error.message;
            statusText.style.color = "#ba1a1a";
          }
        });
      }
    </script>
  </body>
</html>
