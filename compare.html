<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LandLink Compare Properties</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      body { background-color: #fff8f0; color: #1e1b16; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; vertical-align: middle; }
    </style>
  </head>
  <body>
    <header class="bg-primary shadow-md sticky top-0 z-40">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <a href="index.html" class="flex items-center gap-2 text-on-primary font-bold text-xl">
          <span class="material-symbols-outlined text-secondary-fixed">location_on</span>LandLink
        </a>
        <button onclick="window.history.back()" class="text-on-primary hover:text-secondary-fixed">← Back</button>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-6 py-12">
      <h1 class="text-4xl font-bold text-primary mb-8">Compare Properties</h1>
      <div id="compare-content"><p class="text-sm">Loading…</p></div>
    </main>

    <footer class="bg-primary text-on-primary py-12 mt-20">
      <div class="mx-auto max-w-7xl px-6 text-center text-sm opacity-75">&copy; 2024 LandLink. All rights reserved.</div>
    </footer>

    <script src="./api.js"></script>
    <script src="./landing.js"></script>
    <script src="./site-common.js"></script>
    <script>
      async function renderCompareTable() {
        const compareIds = getStoredCompare();
        const box = document.getElementById('compare-content');
        if (!compareIds.length) {
          box.innerHTML = `
            <div class="rounded-3xl bg-white p-12 text-center shadow-md">
              <p class="text-lg text-on-surface-variant mb-6">No properties selected for comparison yet.</p>
              <a href="browse.html" class="inline-block rounded-full bg-primary px-8 py-3 font-semibold text-on-primary">Browse Properties</a>
            </div>`;
          return;
        }

        const listings = [];
        for (const id of compareIds) {
          try {
            const data = await LandLinkAPI.getListing(id);
            if (data.listing) listings.push(data.listing);
          } catch (_) {}
        }

        if (!listings.length) {
          box.innerHTML = `<p class="text-red-700">Could not load compared listings from API.</p>`;
          return;
        }

        const rows = [
          { label: 'Price', render: (l) => '₹' + formatPrice(l.price) },
          { label: 'Area', render: (l) => `${l.area} ${l.unit}` },
          { label: 'Type', render: (l) => String(l.type || '').replace(/_/g, ' ') },
          { label: 'City', render: (l) => l.city },
          { label: 'Status', render: (l) => l.verified ? 'Verified' : l.status },
        ];

        box.innerHTML = `
          <div class="overflow-auto rounded-3xl bg-white shadow-md">
            <table class="min-w-full text-sm">
              <thead>
                <tr class="border-b">
                  <th class="p-4 text-left">Field</th>
                  ${listings.map((l) => `<th class="p-4 text-left"><a class="font-semibold text-primary underline" href="listing.html?id=${encodeURIComponent(l.id)}">${l.title}</a></th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${rows.map((r) => `<tr class="border-b"><td class="p-4 font-semibold">${r.label}</td>${listings.map((l) => `<td class="p-4">${r.render(l)}</td>`).join('')}</tr>`).join('')}
              </tbody>
            </table>
          </div>`;
      }

      document.addEventListener('DOMContentLoaded', renderCompareTable);
    </script>
  </body>
</html>
