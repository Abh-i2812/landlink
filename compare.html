<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LandLink Compare Properties</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      body { background-color: #fff8f0; color: #1e1b16; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; vertical-align: middle; }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="bg-primary shadow-md sticky top-0 z-40">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <a href="index.html" class="flex items-center gap-2 text-on-primary font-bold text-xl">
          <span class="material-symbols-outlined text-secondary-fixed">location_on</span>LandLink
        </a>
        <button onclick="window.history.back()" class="text-on-primary hover:text-secondary-fixed">
          ← Back
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-6 py-12">
      <h1 class="text-4xl font-bold text-primary mb-8">Compare Properties</h1>
      <div id="compare-content"></div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-primary text-on-primary py-12 mt-20">
      <div class="mx-auto max-w-7xl px-6 text-center text-sm opacity-75">
        &copy; 2024 LandLink. All rights reserved.
      </div>
    </footer>

    <script src="./landing.js"></script>
    <script>
      function renderCompareTable() {
        const compareIds = getStoredCompare();
        const compareListings = compareIds.map(id => DEMO_LISTINGS.find(l => l.id === parseInt(id))).filter(Boolean);

        if (compareListings.length === 0) {
          document.getElementById('compare-content').innerHTML = `
            <div class="rounded-3xl bg-white p-12 text-center shadow-md">
              <p class="text-lg text-on-surface-variant mb-6">No properties selected for comparison yet.</p>
              <a href="browse.html" class="inline-block rounded-full bg-primary px-8 py-3 font-semibold text-on-primary hover:bg-primary-container">
                Browse Properties
              </a>
            </div>
          `;
          return;
        }

        const rows = [
          { label: 'Price', key: 'price', format: (v) => '₹' + (v / 10000000).toFixed(1) + ' Cr' },
          { label: 'Area', key: 'area', format: (v, listing) => v + ' ' + listing.unit },
          { label: 'Type', key: 'type', format: (v) => v.replace(/_/g, ' ') },
          { label: 'Location', key: 'city' },
          { label: 'Verified', key: 'verified', format: (v) => v ? '✓ Yes' : '✕ No' },
          { label: 'Price/Unit', key: 'price', format: (v, listing) => '₹' + ((v / listing.area) / 100000).toFixed(1) + 'L' }
        ];

        const html = `
          <div class="overflow-x-auto rounded-3xl shadow-md">
            <table class="w-full bg-white">
              <thead class="bg-primary text-on-primary">
                <tr>
                  <th class="p-4 text-left">Feature</th>
                  ${compareListings.map((l, i) => `<th class="p-4 text-center">${l.title}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${rows.map((row, idx) => `
                  <tr class="${idx % 2 ? 'bg-surface-container' : 'bg-white'}">
                    <td class="p-4 font-semibold text-primary">${row.label}</td>
                    ${compareListings.map(listing => {
                      const value = listing[row.key];
                      const display = row.format ? row.format(value, listing) : value;
                      return `<td class="p-4 text-center">${display}</td>`;
                    }).join('')}
                  </tr>
                `).join('')}
                <tr class="border-t-4 border-primary">
                  <td class="p-4"></td>
                  ${compareListings.map(listing => `
                    <td class="p-4 text-center">
                      <a href="listing.html?id=${listing.id}" class="inline-block rounded-full bg-secondary-fixed px-4 py-2 text-xs font-semibold text-on-secondary-container hover:bg-secondary-fixed/90">
                        View Details →
                      </a>
                    </td>
                  `).join('')}
                </tr>
              </tbody>
            </table>
          </div>

          <div class="mt-8 text-center">
            <button onclick="clearCompare()" class="rounded-full border-2 border-error px-6 py-3 font-semibold text-error hover:bg-error/10 active:scale-95 transition-all">
              Clear Comparison
            </button>
          </div>
        `;

        document.getElementById('compare-content').innerHTML = html;
      }

      function clearCompare() {
        setStoredArray(COMPARE_STORAGE_KEY, []);
        showLandingToast('Comparison cleared');
        renderCompareTable();
      }

      document.addEventListener('DOMContentLoaded', renderCompareTable);
    </script>
  </body>
</html>
