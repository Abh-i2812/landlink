<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LandLink Browse Listings</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      body { background-color: #fff8f0; color: #1e1b16; font-family: 'Plus Jakarta Sans', sans-serif; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; vertical-align: middle; }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="bg-[#412817] text-white shadow-md sticky top-0 z-50">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <a href="index.html" class="flex items-center gap-2 font-bold text-xl">
          <span class="material-symbols-outlined text-[#fdba4b]">location_on</span>LandLink
        </a>
        <nav class="hidden lg:flex items-center gap-6 text-sm opacity-90">
          <a href="index.html" class="hover:text-[#fdba4b]">Home</a>
          <a href="browse.html" class="font-semibold text-[#fdba4b]">Browse</a>
          <a href="sell.html" class="hover:text-[#fdba4b]">Sell</a>
          <a href="about.html" class="hover:text-[#fdba4b]">About</a>
          <a href="contact.html" class="hover:text-[#fdba4b]">Contact</a>
        </nav>
        <div class="flex items-center gap-4">
          <button onclick="toggleMobileMenu()" class="lg:hidden text-white">
            <span class="material-symbols-outlined">menu</span>
          </button>
        </div>
      </div>
      <!-- MOBILE MENU -->
      <div id="mobile-menu" style="transform:translateX(-100%);transition:transform 0.3s;" class="lg:hidden bg-[#5a3e2b] border-t border-white/20">
        <nav class="px-6 py-4 space-y-3 text-sm text-white">
          <a href="index.html" onclick="closeMobileMenu()" class="block py-2">Home</a>
          <a href="browse.html" onclick="closeMobileMenu()" class="block py-2">Browse</a>
          <a href="sell.html" onclick="closeMobileMenu()" class="block py-2">Sell</a>
          <a href="about.html" onclick="closeMobileMenu()" class="block py-2">About</a>
          <a href="contact.html" onclick="closeMobileMenu()" class="block py-2">Contact</a>
        </nav>
      </div>
    </header>

    <main id="browse-page" class="mx-auto max-w-7xl px-6 py-8">
      <!-- FILTER SECTION -->
      <div data-aos="fade-up" class="rounded-3xl bg-white p-8 shadow-md mb-8 border border-amber-900/10">
        <h1 class="text-4xl font-semibold text-[#412817]">Browse Properties</h1>
        <p class="mt-2 text-sm text-[#50453e]">Filter plots by location, type, budget, and area.</p>
        <form class="mt-8 grid gap-4 lg:grid-cols-5" onsubmit="event.preventDefault(); applyFilters();">
          <input id="browse-city" name="city" class="rounded-2xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]" placeholder="City / Location" oninput="applyFilters()" />
          <select id="browse-landtype" name="landType" class="rounded-2xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]" onchange="applyFilters()">
            <option value="">Any type</option>
            <option value="AGRICULTURAL">Agricultural</option>
            <option value="NA_RESIDENTIAL">NA Residential</option>
            <option value="COMMERCIAL">Commercial</option>
            <option value="INDUSTRIAL">Industrial</option>
            <option value="FARMHOUSE">Farmhouse</option>
          </select>
          <input id="browse-minprice" name="minPrice" type="number" min="0" class="rounded-2xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]" placeholder="Min budget (₹)" oninput="applyFilters()" />
          <input id="browse-maxprice" name="maxPrice" type="number" min="0" class="rounded-2xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#fdba4b]" placeholder="Max budget (₹)" oninput="applyFilters()" />
          <button type="submit" class="rounded-full bg-[#412817] px-6 py-3 font-semibold text-white hover:bg-[#5a3e2b] transition-all">Filter</button>
        </form>
      </div>

      <!-- STATUS BAR -->
      <div data-aos="fade-up" class="mt-8 flex flex-col gap-4 rounded-3xl border border-amber-900/10 bg-white p-6 shadow-sm md:flex-row md:items-center md:justify-between">
        <p id="browse-status" class="text-sm text-[#50453e]">Browse live listings, save favorites, and compare plots.</p>
        <div class="flex flex-wrap items-center gap-3">
          <span class="rounded-full bg-[#fdba4b]/20 px-4 py-2 text-sm text-[#412817] font-semibold">
            Saved: <strong id="browse-favorites-count">0</strong>
          </span>
          <span class="rounded-full bg-[#fdba4b]/20 px-4 py-2 text-sm text-[#412817] font-semibold">
            Compare: <strong id="browse-compare-count">0</strong>
          </span>
        </div>
      </div>

      <!-- LISTINGS GRID -->
      <section id="listings-container" class="mt-12 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        <!-- Populated by JS -->
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#412817] text-white py-12 mt-20">
      <div class="mx-auto max-w-7xl px-6 text-center text-sm opacity-75">
        &copy; 2024 LandLink. All rights reserved.
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
    <script src="./site-common.js"></script>
    <script src="./whatsapp.js"></script>
    <script type="module" src="./landing.js"></script>
    <script type="module">
      import { loadListings, formatPrice, getStoredFavorites, getStoredCompare, synchronizeSavedButtons } from "./landing.js";

      async function fetchAndRender() {
        const city = document.getElementById('browse-city')?.value || '';
        const landType = document.getElementById('browse-landtype')?.value || '';
        const minPrice = document.getElementById('browse-minprice')?.value || '';
        const maxPrice = document.getElementById('browse-maxprice')?.value || '';
        const container = document.getElementById('listings-container');
        if (!container) return;
        container.innerHTML = '<p class="text-sm text-[#50453e]">Loading properties...</p>';

        try {
          const listings = await loadListings({ city, landType, minPrice, maxPrice });
          renderListings(listings);
        } catch (err) {
          container.innerHTML = `<p class="text-sm text-gray-500">No properties matching filters.</p>`;
        }
      }

      window.applyFilters = fetchAndRender;

      function renderListings(listings) {
        const container = document.getElementById('listings-container');
        const favorites = getStoredFavorites();
        const compare = getStoredCompare();

        if (!listings || !listings.length) {
          container.innerHTML = '<p class="text-sm text-[#50453e]">No properties match these filters.</p>';
          return;
        }

        container.innerHTML = listings.map(listing => {
          const id = String(listing.id);
          return `
          <article class="rounded-3xl border border-amber-900/10 bg-white shadow-lg overflow-hidden hover:shadow-xl transition-all">
            <div class="h-56 bg-cover bg-center" style="background-image:url('${listing.image}');"></div>
            <div class="p-6">
              <div class="flex items-center justify-between">
                <p class="text-xs uppercase tracking-wide text-[#412817] font-bold">${String(listing.type || '').replace(/_/g, ' ')}</p>
                <span class="text-xs bg-amber-100 text-amber-900 px-3 py-1 rounded-full font-semibold">Verified</span>
              </div>
              <h2 class="mt-3 text-2xl font-semibold text-[#412817]">${listing.title}</h2>
              <p class="mt-3 text-sm leading-6 text-[#50453e]">${listing.area} in ${listing.city}.</p>
              <div class="mt-6 flex items-center justify-between text-sm">
                <span class="font-bold text-xl text-[#412817]">₹ ${formatPrice(listing.price)}</span>
                <div class="flex gap-2">
                  <button data-favorite-button="${id}" class="rounded-full ${favorites.includes(id) ? 'bg-[#fdba4b] text-[#281800]' : 'bg-[#fff4e7] text-[#412817]'} px-3 py-1.5 text-xs font-semibold cursor-pointer">★ Favorite</button>
                  <label class="inline-flex items-center gap-1 rounded-full bg-[#fff4e7] px-3 py-1.5 text-xs font-semibold cursor-pointer text-[#412817]">
                    <input data-compare-checkbox data-compare-id="${id}" type="checkbox" ${compare.includes(id) ? 'checked' : ''} class="rounded cursor-pointer" />
                    Compare
                  </label>
                </div>
              </div>
              <a href="listing.html?id=${encodeURIComponent(id)}" class="mt-4 block text-center rounded-full bg-[#fdba4b] px-4 py-2.5 text-xs font-semibold text-[#281800] hover:bg-[#e0a23c]">View Details</a>
            </div>
          </article>`;
        }).join('');
        synchronizeSavedButtons();
      }

      document.addEventListener('DOMContentLoaded', () => {
        AOS.init({ duration: 800, once: true });
        fetchAndRender();
      });
    </script>
  </body>
</html>
