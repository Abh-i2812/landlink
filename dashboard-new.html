<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LandLink Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      body { background-color: #fff8f0; color: #1e1b16; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }
    </style>
  </head>
  <body>
    <header class="bg-primary shadow-md sticky top-0 z-40">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <a href="index.html" class="flex items-center gap-2 text-on-primary font-bold text-xl">
          <span class="material-symbols-outlined text-secondary-fixed">location_on</span>LandLink
        </a>
        <div class="flex items-center gap-4">
          <span id="user-name" class="text-on-primary text-sm"></span>
          <button id="dashboard-logout" class="text-on-primary hover:text-secondary-fixed">Logout</button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-6 py-12">
      <div id="dashboard-page">
        <h1 id="dashboard-greeting" class="text-4xl font-bold text-primary mb-2"></h1>
        <p id="dashboard-details" class="text-on-surface-variant mb-12"></p>

        <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
          <div data-aos="fade-up" class="rounded-3xl bg-white p-8 shadow-md">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-on-surface-variant">My Listings</p>
                <p id="my-listings-count" class="text-4xl font-bold text-primary mt-2">0</p>
              </div>
              <span class="material-symbols-outlined text-5xl opacity-20">home</span>
            </div>
            <a href="sell.html" class="mt-4 block text-center rounded-full bg-secondary-fixed px-4 py-2 text-xs font-semibold text-on-secondary-container hover:bg-secondary-fixed/90">
              + New Listing
            </a>
          </div>

          <div data-aos="fade-up" class="rounded-3xl bg-white p-8 shadow-md">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-on-surface-variant">Saved Favorites</p>
                <p id="my-favorites-count" class="text-4xl font-bold text-primary mt-2">0</p>
              </div>
              <span class="material-symbols-outlined text-5xl opacity-20">favorite</span>
            </div>
            <a href="browse.html" class="mt-4 block text-center rounded-full bg-secondary-fixed px-4 py-2 text-xs font-semibold text-on-secondary-container hover:bg-secondary-fixed/90">
              Browse More
            </a>
          </div>

          <div data-aos="fade-up" class="rounded-3xl bg-white p-8 shadow-md">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-on-surface-variant">Comparing</p>
                <p id="my-compare-count" class="text-4xl font-bold text-primary mt-2">0</p>
              </div>
              <span class="material-symbols-outlined text-5xl opacity-20">compare</span>
            </div>
            <a href="compare.html" class="mt-4 block text-center rounded-full bg-secondary-fixed px-4 py-2 text-xs font-semibold text-on-secondary-container hover:bg-secondary-fixed/90">
              View Compare
            </a>
          </div>
        </div>

        <div class="mt-12 rounded-3xl bg-surface-container p-8">
          <h2 class="text-2xl font-bold text-primary mb-6">Quick Actions</h2>
          <div class="grid gap-4 md:grid-cols-2">
            <a href="browse.html" class="rounded-full bg-white px-6 py-4 font-semibold text-primary hover:shadow-md transition-all text-center">🔍 Browse Listings</a>
            <a href="sell.html" class="rounded-full bg-primary px-6 py-4 font-semibold text-on-primary hover:bg-primary-container transition-all text-center">📝 Post Property</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-primary text-on-primary py-12 mt-20">
      <div class="mx-auto max-w-7xl px-6 text-center text-sm opacity-75">
        &copy; 2024 LandLink. All rights reserved.
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
    <script src="./landing.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        AOS.init({ duration: 800, once: true });
        attachDashboardPageEvents();
        
        const user = getStoredUser();
        if (!user) navigateTo('auth.html');
        
        document.getElementById('user-name').textContent = user?.name || 'User';
        document.getElementById('my-listings-count').textContent = (JSON.parse(localStorage.getItem('landlinkUserListings') || '[]')).length;
        document.getElementById('my-favorites-count').textContent = getStoredFavorites().length;
        document.getElementById('my-compare-count').textContent = getStoredCompare().length;
      });
    </script>
  </body>
</html>
